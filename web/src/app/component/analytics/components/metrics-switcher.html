<div class="switcher">
  <button
    class="tab"
    [class.active]="view === 'timeseries'"
    (click)="select('timeseries')">
    Time Series
  </button>

  <button
    class="tab"
    [class.active]="view === 'trending'"
    (click)="select('trending')">
    Trending Now
  </button>
</div>

<div class="panel">
  <app-time-series *ngIf="view === 'timeseries'"></app-time-series>

  <app-trending-now
    *ngIf="view === 'trending'"
    [window]="'1h'"
    [baseline]="'24h'"
    [limit]="5"
    [autoRefreshSec]="60">
  </app-trending-now>
</div>
