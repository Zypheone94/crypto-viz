<div class="switcher">



  <button class="tab" [class.active]="view === 'trending'" (click)="select('trending')">
    <mat-icon>trending_up</mat-icon>
    Trending Now
  </button>

  <button class="tab" [class.active]="view === 'ecartTypeGlissant'" (click)="select('ecartTypeGlissant')">
    <mat-icon>trending_down</mat-icon>
    Écart-type glissant
  </button>

  <button class="tab" [class.active]="view === 'rsi'" (click)="select('rsi')">
    <mat-icon>show_chart</mat-icon>
    RSI
  </button>

  <button class="tab" [class.active]="view === 'crossCorrelation'" (click)="select('crossCorrelation')">
    <mat-icon>compare_arrows</mat-icon>
    Corrélation croisée
  </button>

  <button
    class="tab"
    [class.active]="view === 'linearRegression'"
    (click)="select('linearRegression')">
    <mat-icon>analytics</mat-icon>
    Régression (prochaine heure)
  </button>

  <button
    class="tab"
    [class.active]="view === 'movingAverages'"
    (click)="select('movingAverages')">
    <mat-icon>moving</mat-icon>
    Moyennes Mobiles
  </button>

  <button
    class="tab"
    [class.active]="view === 'randomForest'"
    (click)="select('randomForest')">
    <mat-icon>forest</mat-icon>
    Random Forest
  </button>

</div>

<div class="panel">



  <app-trending-now *ngIf="view === 'trending'" window="1h" baseline="24h" [limit]="5" [autoRefreshSec]="60">
  </app-trending-now>

  <app-ecart-type-glissant *ngIf="view === 'ecartTypeGlissant'">
  </app-ecart-type-glissant>

  <app-linear-regression-next-hour
    *ngIf="view === 'linearRegression'">
  </app-linear-regression-next-hour>

  <app-rsi
    *ngIf="view === 'rsi'">
  </app-rsi>

  <app-cross-correlation *ngIf="view === 'crossCorrelation'">
  </app-cross-correlation>

  <app-moving-averages
    *ngIf="view === 'movingAverages'">
  </app-moving-averages>

  <app-random-forest
    *ngIf="view === 'randomForest'">
  </app-random-forest>

</div>
