<div class="switcher">

  <button
    class="tab"
    [class.active]="view === 'timeseries'"
    (click)="select('timeseries')">
    <mat-icon>timeline</mat-icon>
    Time Series
  </button>

  <button
    class="tab"
    [class.active]="view === 'trending'"
    (click)="select('trending')">
    <mat-icon>trending_up</mat-icon>
    Trending Now
  </button>

  <button
    class="tab"
    [class.active]="view === 'ecartTypeGlissant'"
    (click)="select('ecartTypeGlissant')">
    <mat-icon>trending_down</mat-icon>
    Écart-type glissant
  </button>

  <button
    class="tab"
    [class.active]="view === 'rsi'"
    (click)="select('rsi')">
    <mat-icon>show_chart</mat-icon>
    RSI
  </button>

</div>


<div class="panel">

  <app-time-series
    *ngIf="view === 'timeseries'">
  </app-time-series>

  <app-trending-now
    *ngIf="view === 'trending'"
    window="1h"
    baseline="24h"
    [limit]="5"
    [autoRefreshSec]="60">
  </app-trending-now>

  <app-ecart-type-glissant
    *ngIf="view === 'ecartTypeGlissant'">
  </app-ecart-type-glissant>

  <app-rsi
    *ngIf="view === 'rsi'">
  </app-rsi>

</div>
