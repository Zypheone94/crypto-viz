<div>
  <div *ngIf="currentState === componentState.LOADING" class="loading-container">
    <mat-spinner></mat-spinner>
    <p>Loading data...</p>
  </div>

  <div *ngIf="currentState === componentState.ERROR" class="error-container">
    <p class="error-message">Error: {{ errorMessage }}</p>
  </div>

  <div *ngIf="currentState === componentState.EMPTY" class="no-result-container">
    <p>No data available for the selected time range.</p>
  </div>

  <div *ngIf="currentState === componentState.NOTREADY" class="no-result-container">
    <p>Please select a date range to get results.</p>
  </div>

  <div *ngIf="currentState === componentState.READY" class="data-container">
    <div class="chart-header">
      <h3>Analyse des tendances crypto</h3>
      <p class="chart-subtitle">Évolution temporelle des volumes et activités</p>
    </div>
    <div class="chart-wrapper">
      <canvas
        baseChart
        [type]="'line'"
        [data]="areaChartData"
        [options]="areaChartOptions"
        [legend]="areaChartLegend"
      >
      </canvas>
    </div>
  </div>

  <div style="display: block"></div>
</div>
