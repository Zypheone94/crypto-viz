<div class="layout-container">
  <!-- Header compact -->
  <header class="header small-header">
    <div class="header-left">
      <div class="logo">
        <h1 class="app-title">CryptoViz</h1>
      </div>

      <!-- Navigation -->
      <nav class="header-nav">
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.route"
          [class.active]="isActiveRoute(item.route)"
          class="nav-link"
          (click)="onNavClick(item.route)"
        >
          <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
          <span class="nav-text">{{ item.label }}</span>
        </a>
      </nav>
    </div>
  </header>

  <div class="main-container">
    <!-- Sidebar toujours affichée -->
    <aside class="filters-sidebar">
      <div class="sidebar-header">
        <h3>
          <mat-icon>settings</mat-icon>
          Options
        </h3>
      </div>

      <div class="filters-content">
        <!-- Contenu spécifique à Analytics -->
        <ng-container *ngIf="selectedTab === 'analytics'; else emptySidebar">
          <mat-expansion-panel class="filter-panel" expanded="true">
            <mat-expansion-panel-header>
              <mat-panel-title>
                <mat-icon>tune</mat-icon>
                Filtres d'analyse
              </mat-panel-title>
            </mat-expansion-panel-header>
            
            <div class="filter-options">
              <!-- Date Picker -->
              <mat-form-field appearance="outline" class="date-field">
                <mat-label>
                  <mat-icon>calendar_today</mat-icon>
                  Date de référence
                </mat-label>
                <input 
                  matInput 
                  [matDatepicker]="picker" 
                  [(ngModel)]="selectedDate"
                  (dateChange)="onDateChange($event.value)"
                />
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
              </mat-form-field>

              <!-- Time Range Selector -->
              <mat-form-field appearance="outline" class="range-field">
                <mat-label>
                  <mat-icon>schedule</mat-icon>
                  Période d'analyse
                </mat-label>
                <mat-select 
                  [(ngModel)]="selectedTimeRange"
                  (selectionChange)="onTimeRangeChange($event.value)"
                >
                  <mat-option *ngFor="let range of timeRanges" [value]="range.value">
                    {{ range.label }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>

            <div class="filter-actions">
              <button mat-stroked-button class="reset-btn" (click)="resetFilters()">
                <mat-icon>refresh</mat-icon>
                Réinitialiser
              </button>
            </div>
          </mat-expansion-panel>
        </ng-container>

        <!-- Contenu vide ou placeholder -->
        <ng-template #emptySidebar>
          <p class="placeholder">Aucun filtre disponible pour cette page.</p>
        </ng-template>
      </div>
    </aside>

    <!-- Corps principal -->
    <main class="main-content">
      <div class="content-header">
        <div class="page-title">
          <h2>{{ getPageTitle() }}</h2>
          <p class="page-description">{{ getPageDescription() }}</p>
        </div>
      </div>

      <div class="content-body">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
