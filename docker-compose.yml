services:
  api:
    build:
      context: .
      dockerfile: ingestor/scraper/Dockerfile
    volumes:
      - ./ingestor:/app/ingestor
    working_dir: /app/ingestor/scraper/
    ports:
      - "${SCRAPER_PORT}:8080"
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    env_file:
      - .env
    depends_on:
      - feeder

  scraper:
    build:
      context: .
      dockerfile: ingestor/scraper/component/scraper/Dockerfile
    volumes:
      - ./ingestor:/app/ingestor
    working_dir: /app/ingestor/scraper/component/scraper

  feeder:
    build:
      context: .
      dockerfile: ingestor/scraper/component/scraperdb/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ingestor:/app/ingestor
      - ./data:/data
    working_dir: /app
    env_file:
      - .env
    command: python /app/ingestor/scraper/component/scraperdb/database_feeder.py

  web:
    build:
      context: web
      dockerfile: Dockerfile
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
      - ./.env:/app/.env
    ports:
      - "${ANGULAR_PORT}:4200"
    command: npm run serve

  builder:
    build:
      context: .
      dockerfile: ingestor/builder/Dockerfile
    volumes:
      - .:/app
      - ./data:/data
    command: python ingestor/builder/consumer.py
    env_file:
      - .env
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user # Default user
      RABBITMQ_DEFAULT_PASS: password # Default Password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data: