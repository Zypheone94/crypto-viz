[project]
name = "Crypto-Viz"
version = "0.1.0"
description = "Ingestor : scraper + builder"
authors = [{name = "Max", email = "maxime.durand@epitech.eu"}]
readme = "README.md"
requires-python = ">=3.13.5"
dependencies = [
    "certifi",
    "charset-normalizer",
    "idna",
    "pip",
    "requests",
    "setuptools",
    "urllib3",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "scrapy",
    "twisted",
    "selenium",
    "webdriver-manager",
    "fake-useragent",
    "requests",
    "pydantic",
    "feedparser",
    "pytest"
]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scraper", "builder"]